[package]
name = "akasha"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
jsonschema = { version = "0.46", default-features = false }
teloxide = { version = "0.17", default-features = false, features = ["rustls", "ctrlc_handler", "macros"] }
thiserror = "1"
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", features = [
    "client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
schemars = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0.102"
uuid = { version = "1", features = ["v7"] }
